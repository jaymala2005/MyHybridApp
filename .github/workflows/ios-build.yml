name: iOS Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  PROJECT_PATH: MyHybridApp/MyHybridApp.csproj
  # Must match a TargetFramework in the csproj (currently net10.0-ios).
  DOTNET_VERSION: '10.0.x'
  TARGET_FRAMEWORK: net10.0-ios
  CONFIGURATION: Release

jobs:
  build-ios:
    # .NET 10 iOS needs Xcode 26, which requires macOS 15+ (macos-14 cannot run it).
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      # Code signing is disabled so the build runs without certificates or
      # provisioning profiles (the csproj also does this when CI=true). The
      # resulting .app is not installable on a device until it is signed.
      # RuntimeIdentifier is set explicitly because the default is a simulator RID.
      - name: Build
        run: >
          dotnet build ${{ env.PROJECT_PATH }}
          -f ${{ env.TARGET_FRAMEWORK }}
          -c ${{ env.CONFIGURATION }}
          -p:RuntimeIdentifier=ios-arm64
          -p:EnableCodeSigning=false

      - name: Upload iOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-${{ github.run_number }}
          path: |
            MyHybridApp/bin/${{ env.CONFIGURATION }}/${{ env.TARGET_FRAMEWORK }}/**/*.app
            MyHybridApp/bin/${{ env.CONFIGURATION }}/${{ env.TARGET_FRAMEWORK }}/**/*.ipa
          if-no-files-found: error
          retention-days: 14
